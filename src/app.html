<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A1E3A">
<meta name="description" content="{{NAME}} · {{SUB}} 会员积分与打卡">
<link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{SHORT}}">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>{{NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@700;900&family=Sora:wght@500;700;800&display=swap">
<style>
/* Layout: a phone-first member app (max 480px column) with a bottom tab bar; staff get an extra 管理 tab. */
:root{
  --bg:#FBF5F3; --surface:#FFFFFF; --surface-2:#F7EEEC; --ink:#2A1419; --muted:#7D6A6E; --line:#EADCDA;
  --wine:#7A1E3A; --wine-deep:#561226; --on-wine:#FFF7F2; --wine-soft:#F6E3E8;
  --gold:#C9851F; --gold-soft:#FBEBCC; --ok:#2E7D5B; --ok-soft:#DDF0E6; --warn:#B4581E; --warn-soft:#FBE6D6;
  --shadow:0 6px 24px rgba(86,18,38,.08);
  --k1:#B0274E;--k1s:#FBE3EA;--k2:#C76A10;--k2s:#FDEBD6;--k3:#2E8657;--k3s:#DFF3E8;--k4:#2463B0;--k4s:#DFEBFA;--k5:#7A44B8;--k5s:#EEE4FA;--k6:#0F8A8A;--k6s:#D9F2F1;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-num:"Sora","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#170E11; --surface:#21151A; --surface-2:#2A1B21; --ink:#F5E9EA; --muted:#B49FA4; --line:#3A262D;
  --wine:#C9557A; --wine-deep:#6A1A33; --on-wine:#FFF7F2; --wine-soft:#3A1C27;
  --gold:#E8B35A; --gold-soft:#3A2B14; --ok:#6CC59A; --ok-soft:#173528; --warn:#EE9A62; --warn-soft:#3B2416;
  --shadow:0 6px 24px rgba(0,0,0,.35); --k1:#F07FA0;--k1s:#3F1A26;--k2:#F2A55A;--k2s:#3D2814;--k3:#72CF9C;--k3s:#163528;--k4:#7FB2F2;--k4s:#16273F;--k5:#BE98EE;--k5s:#2B1E3F;--k6:#5FD3CF;--k6s:#123332; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170E11; --surface:#21151A; --surface-2:#2A1B21; --ink:#F5E9EA; --muted:#B49FA4; --line:#3A262D;
  --wine:#C9557A; --wine-deep:#6A1A33; --on-wine:#FFF7F2; --wine-soft:#3A1C27;
  --gold:#E8B35A; --gold-soft:#3A2B14; --ok:#6CC59A; --ok-soft:#173528; --warn:#EE9A62; --warn-soft:#3B2416;
  --shadow:0 6px 24px rgba(0,0,0,.35); --k1:#F07FA0;--k1s:#3F1A26;--k2:#F2A55A;--k2s:#3D2814;--k3:#72CF9C;--k3s:#163528;--k4:#7FB2F2;--k4s:#16273F;--k5:#BE98EE;--k5s:#2B1E3F;--k6:#5FD3CF;--k6s:#123332; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:20px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;display:block;flex:none}
.brand b{font-family:var(--f-display);font-size:23px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.demo{font-size:15px;padding:4px 8px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:700;white-space:nowrap;flex:none}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,var(--wine) 0%,var(--wine-deep) 100%);color:var(--on-wine);padding:22px 20px;min-height:168px}
.hero.has-img{background-size:cover;background-position:center}
.hero.has-img::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,10,25,.85),rgba(60,10,25,.15))}
.hero>*{position:relative}
.hero.center{padding-bottom:44px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero.center h1,.hero.center p{margin-inline:auto}
.giftbox{width:1.25em;height:1.25em;vertical-align:-.22em;margin-left:.2em;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
@media (prefers-reduced-motion:no-preference){.giftbox{animation:bob 2.4s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.hero .eyebrow{font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero h1{font-family:var(--f-display);line-height:1.35;font-size:32px;margin:6px 0 8px;max-width:15em}
.hero p{margin:0;opacity:.85;font-size:17px;max-width:24em}
.coins{position:absolute;right:-18px;bottom:-22px;width:150px;height:150px;pointer-events:none}
.hero.has-img .coins{display:none}

/* member card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.mcard{margin-top:-28px;margin-inline:10px;position:relative;box-shadow:var(--shadow)}
.mrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.mname{font-weight:700}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:15px;font-weight:700;letter-spacing:.06em;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.tier.Silver{background:var(--surface-2);color:var(--muted)}
.tier.Gold{background:var(--gold-soft);color:var(--gold)}
.tier.Platinum{background:var(--wine-soft);color:var(--wine)}
.pts{font-family:var(--f-num);font-weight:800;font-size:44px;line-height:1;color:var(--wine)}
.pin{font-size:28px;letter-spacing:.5em;text-align:center}
.pts small{font-size:16px;font-weight:500;color:var(--muted);margin-left:4px;font-family:var(--f-body)}
.sub{color:var(--muted);font-size:16px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--wine));border-radius:99px}

/* sections */
.sec{margin-top:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.sec-h h2{font-family:var(--f-display);font-size:24px}
.link{color:var(--wine);font-size:17px;font-weight:500}

/* quick grid */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:500;text-align:center}
.q{background:var(--cs,var(--surface));border-color:transparent;color:var(--ink)}
.q .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--surface)}
.q:nth-child(1){--c:var(--k1);--cs:var(--k1s)}.q:nth-child(2){--c:var(--k2);--cs:var(--k2s)}.q:nth-child(3){--c:var(--k3);--cs:var(--k3s)}.q:nth-child(4){--c:var(--k4);--cs:var(--k4s)}

/* promo */
.promo{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.promo .burst{flex:none;width:80px;height:80px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;text-align:center;line-height:1;font-family:var(--f-num);font-weight:800;font-size:24px}
.promo .burst small{display:block;font-size:14px;font-weight:600;letter-spacing:.08em}
.promo b{display:block}

/* rewards */
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;margin-inline:-4px;padding-inline:4px}
.hscroll .rw{flex:0 0 170px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rw{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
/* category colour */
.rw{background:var(--cs);border-color:transparent}
.rw .pill.soft{background:var(--surface);color:var(--c)}
.rw .pill:not(.soft){background:var(--c)}
.ph .tag{color:var(--surface)!important;background:var(--c)!important}
.ph .tag{position:absolute;left:8px;top:8px;font-size:14px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--surface);color:var(--muted)}
.rw .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.rw .nm{font-weight:700;font-size:18px;line-height:1.3}
.rw .en{color:var(--muted);font-size:16px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--wine);color:var(--on-wine);border-radius:99px;padding:3px 10px;font-family:var(--f-num);font-weight:700;font-size:16px}
.pill.soft{background:var(--wine-soft);color:var(--wine)}
.stock{font-size:15px;color:var(--muted)}
.out{opacity:.55}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:17px;white-space:nowrap}
.chip[style]{background:var(--cs);color:var(--c);border-color:transparent;font-weight:700}
.chip.on{background:var(--wine);color:var(--on-wine);border-color:var(--wine)}
.chip[style].on{background:var(--c);color:var(--surface)}

/* tasks */
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task{--c:var(--k1);--cs:var(--k1s);background:var(--cs);border-color:transparent}
.task .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--c);color:var(--surface);display:grid;place-items:center}
.task .plus{color:var(--c)}
.task[data-k='2']{--c:var(--k2);--cs:var(--k2s)}.task[data-k='3']{--c:var(--k3);--cs:var(--k3s)}.task[data-k='4']{--c:var(--k4);--cs:var(--k4s)}.task[data-k='5']{--c:var(--k5);--cs:var(--k5s)}.task[data-k='6']{--c:var(--k6);--cs:var(--k6s)}
.task .btn.ghost{background:var(--surface);color:var(--c)}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:20px}
.task .tx span{color:var(--muted);font-size:16px}
.flag{font-size:14px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.plus{font-family:var(--f-num);font-weight:800;color:var(--gold);white-space:nowrap}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;background:var(--wine);color:var(--on-wine);font-weight:700;font-size:20px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:16px;border-radius:10px}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:16px;color:var(--muted);font-weight:500}
.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uploader{display:flex;gap:12px;align-items:center}
.uploader .ph{width:84px;height:84px;flex:none;border-radius:14px;border:1px dashed var(--line)}
.uploader.wide .ph{width:140px;aspect-ratio:16/9;height:auto}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:15px;color:var(--muted)}
.tab.on{color:var(--wine);font-weight:700}
.tab.scan{position:relative;color:var(--wine);font-weight:700}
.tab.scan .bub{width:58px;height:58px;margin-top:-26px;border-radius:50%;background:var(--wine);color:var(--on-wine);display:grid;place-items:center;box-shadow:0 6px 16px rgba(86,18,38,.35);border:4px solid var(--surface)}
.scanbig{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:18px;background:var(--wine);color:var(--on-wine);text-align:left}
.scanbig .bub{flex:none;width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.scanbig b{display:block;font-size:24px}
.scanbig span{opacity:.85;font-size:16px}
.cam{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:18px;overflow:hidden;background:#000}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,6,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.sheet h3{font-family:var(--f-display);font-size:25px;margin-bottom:12px}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.actions{display:flex;gap:10px;margin-top:6px}
.actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:17px;max-width:calc(100% - 32px)}

/* admin */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:17px;color:var(--muted)}
.seg{overflow-x:auto}.seg button{flex:none;padding-inline:12px;white-space:nowrap}
.how{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:700;font-size:15px}
.h-self{background:var(--ok-soft);color:var(--ok)}.h-staff{background:var(--warn-soft);color:var(--warn)}
.terms{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--muted)}
.terms b{color:var(--ink)}
.terms ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tiers .trow{display:grid;grid-template-columns:1fr auto;grid-template-areas:'t p' 'c c';gap:6px 10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.tiers .trow .tier{grid-area:t;justify-self:start}.tiers .trow .tp{grid-area:p}.tiers .trow .cond{grid-area:c}
.tiers .trow+.trow{margin-top:4px}
.tiers .trow.me{background:var(--gold-soft);outline:2px solid var(--gold)}
.tiers .cond{font-size:15px;line-height:1.35}
.tiers .tp{font-weight:800;color:var(--wine);white-space:nowrap}.tiers .tp small{font-size:12px;color:var(--muted);font-weight:500}
.myprog{margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:16px}
.myprog .step{padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--ink);line-height:1.5}
.myprog .step.Platinum{background:var(--wine-soft)}
.langbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;color:var(--wine)}
.bellbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--wine)}
.bellbtn .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--warn);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;font-family:var(--f-num)}
.pushcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--ink)}
.pushcard>svg{flex:none;color:var(--gold)}.pushcard.on{background:var(--ok-soft)}.pushcard.on>svg{color:var(--ok)}
.newnote{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:14px;background:var(--wine-soft);color:var(--wine)}
.newnote b{color:var(--ink)}
.noticelist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.notice{display:flex;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.notice.new{border-color:var(--gold);background:var(--gold-soft)}
.notice .ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--wine-soft);color:var(--wine)}
.notice .nb{margin:2px 0 4px;white-space:pre-wrap}
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tiles>div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column}
.bars{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:2px;height:150px;align-items:end}
.bar-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar-col i{display:block;width:100%;min-height:2px;background:var(--wine);border-radius:4px 4px 0 0}
.bar-v{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.bars.many .bar-v{display:none}
.bar-x{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:6px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.arow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.arow.mem{flex-wrap:wrap}.arow.mem .tx{flex-basis:100%}.arow.mem .tx b{white-space:normal}.arow.mem .btnrow{width:100%;justify-content:flex-start}
.arow .ph{width:52px;height:52px;flex:none;border-radius:10px}
.arow .tx{flex:1;min-width:0}
.arow .tx b{display:block;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .tx span{color:var(--muted);font-size:16px}
.badge{font-size:15px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.pending{background:var(--gold-soft);color:var(--gold)}
.badge.approved{background:var(--ok-soft);color:var(--ok)}
.badge.rejected{background:var(--warn-soft);color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:16px;font-size:17px}

async function api(path,body){

  return j;
}

const I18N=__I18N__;
const LANGS=[['zh','中文'],['en','English'],['ms','Bahasa Melayu']];
let LANG=(()=>{try{return localStorage.getItem('vw_lang')||'zh'}catch(e){return 'zh'}})();
const L=()=>LANG;
const CJK=/[\u3400-\u9fff\uff01-\uff5e\u3000-\u303f]/;
const NUMRE=/10\+1|\d{4}-\d{2}-\d{2}|\d{1,2}:\d{2}|\d[\d,]*(?:\.\d+)?/g;
window._miss=new Set();
let FRAGS=null;
function frags(){ if(FRAGS) return FRAGS; const i=LANG==='en'?0:1; FRAGS=Object.keys(I18N).filter(k=>k.length>=2&&!k.includes('{')).sort((a,b)=>b.length-a.length).map(k=>[k,I18N[k][i]]); return FRAGS; }
function trText(str){
  if(LANG==='zh'||!str||!CJK.test(str)) return str;
  const lead=str.match(/^\s*/)[0], tail=str.match(/\s*$/)[0], core=str.trim(), nums=[];
  const key=core.replace(NUMRE,m=>{ if(m==='10+1') return m; nums.push(m);return '{'+(nums.length-1)+'}';});
  const hit=I18N[key]; let out;
  if(hit) out=hit[LANG==='en'?0:1];
  else { window._miss.add(key); out=key; for(const [k,v] of frags()){ if(out.includes(k)) out=out.split(k).join(v); if(!CJK.test(out)) break; } }
  out=out.replace(/\{(\d+)\}/g,(_,i)=>nums[+i]??'');
  return (/^[,.;:)!?]/.test(out)?'':lead)+out+tail;
}
const SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1};
function trNode(root){
  if(LANG==='zh'||!root) return;
  if(root.nodeType===3){ const p=root.parentElement; if(p&&!SKIP[p.tagName]&&!p.closest('[translate="no"]')){ const v=trText(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; } return; }
  if(root.nodeType!==1||SKIP[root.tagName]||root.closest('[translate="no"]')) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1?((SKIP[n.tagName]||n.getAttribute('translate')==='no')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP):NodeFilter.FILTER_ACCEPT});
  const list=[]; let n; while((n=w.nextNode())) list.push(n);
  list.forEach(t=>{ const v=trText(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v; });
  [root,...root.querySelectorAll('[placeholder],[title],[aria-label]')].forEach(el=>{ if(el.closest('[translate="no"]')) return; ['placeholder','title','aria-label'].forEach(a=>{ const v=el.getAttribute&&el.getAttribute(a); if(v&&CJK.test(v)) el.setAttribute(a,trText(v)); }); });
}
const trObs=new MutationObserver(ms=>{ if(LANG==='zh') return; trObs.disconnect(); ms.forEach(m=>{ if(m.type==='characterData') trNode(m.target); else m.addedNodes.forEach(trNode); }); trWatch(); });
function trWatch(){ trObs.observe(document.body,{childList:true,subtree:true,characterData:true}); }

function pushCard(compact){

  if(st==='ios') return `<div class="pushcard">${ic('bell',22)}<div style="flex:1;min-width:0"><b>想在 iPhone 收到通知？</b><span class="sub" style="display:block">先按 Safari 下方的分享按钮 → 「加入主画面」，再从主画面打开 App，就会看到「开启手机通知」的按钮。</span></div></div>`;
  return `<div class="pushcard">${ic('bell',22)}<div style="flex:1;min-width:0"><b>开启手机通知</b><span class="sub" style="display:block">兑换结果、卡快用完、俱乐部公告会直接通知你。</span></div><button class="btn sm" data-act="pushOn">开启</button></div>`;
}
let swReg=null;
async function getReg(){ if(swReg) return swReg; swReg=await navigator.serviceWorker.register('/sw.js'); return swReg; }
async function syncPush(){
  if(!pushSupported()) return;
  try{
    const reg=await getReg(); const sub=await reg.pushManager.getSubscription();
    const on=!!sub&&Notification.permission==='granted';
    const changed=on!==PUSH_ON; PUSH_ON=on;
    const link=on&&myPhone?myPhone+'|'+LANG+'|'+sub.endpoint:null;
    if(link&&link!==pushLinked){ pushLinked=link; await api('push/subscribe',{...sub.toJSON(),lang:LANG}).catch(()=>{pushLinked=null;}); }
    if(changed) render();
  }catch(e){}
}
async function enablePush(btn){
  if(!myPhone) return toast('请先登入');
  if(btn) btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast('没有开启通知。你之后可以在手机设定里允许。'); render(); return; }
    const reg=await getReg(); await navigator.serviceWorker.ready;
    const k=await api('push/key'); if(!k.key) throw new Error('通知还没准备好');
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unb64u(k.key)});
    await api('push/subscribe',{...sub.toJSON(),lang:LANG}); pushLinked=myPhone+'|'+LANG+'|'+sub.endpoint;
    PUSH_ON=true; toast('手机通知已开启'); render(); if(document.querySelector('.sheet .noticelist')) openNotices();
  }catch(e){ toast('开启通知失败：'+(e.message||'请稍后再试')); if(btn) btn.disabled=false; }
}
async function disablePush(){
  try{ const reg=await getReg(); const sub=await reg.pushManager.getSubscription(); if(sub){ await api('push/unsubscribe',{endpoint:sub.endpoint}).catch(()=>{}); await sub.unsubscribe(); } }catch(e){}
  PUSH_ON=false; pushLinked=null; toast('手机通知已关闭'); render();
}
async function unlinkPush(){ try{ if(!pushSupported()) return; const reg=await getReg(); const sub=await reg.pushManager.getSubscription(); if(sub) await api('push/unsubscribe',{endpoint:sub.endpoint}); }catch(e){} pushLinked=null; }
function unb64u(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

  const list=S.feed||[], seen=seenTs();

  if(list.length) ls.set(seenKey(),String(Math.max(...list.map(n=>n.ts))));

const nameOf=x=>LANG==='zh'?x.name:(x.en||x.name);

async function shrink(file,max=900){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('读不到这张照片'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.82);
  } finally { URL.revokeObjectURL(url); }
}
async function squarePng(file,size){
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('读不到这张图片'));i.src=url;});
    const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,size,size);
    const k=Math.max(size/img.width,size/img.height), w=img.width*k, h=img.height*k; x.drawImage(img,(size-w)/2,(size-h)/2,w,h); return c.toDataURL('image/png');
  } finally { URL.revokeObjectURL(url); }
}

function h36(str){let h=2166136261>>>0;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h.toString(36);}
const qrMode=()=>(S.settings&&S.settings.qrMode)||'fixed';
function qrCodeFor(date){const st=S.settings||{}; if(!st.qrKey||qrMode()==='off') return null; return h36(st.qrKey+'|'+(qrMode()==='fixed'?'fixed':date));}

const CARD_TYPES=[{n:'10+1 Program',total:11,kind:'10+1'},{n:'30 天 Program',total:30,kind:'30'},{n:'Daily Pass',total:1,kind:'daily'}];
/* 等级规则：10+1 卡算 1 张，30 天卡算 3 张（9 张 10+1 = 3 张 30 天）。App 里开过的卡（不论有没有付款）+ 以前买过的卡一起算。
   超过 9 → Gold，超过 18 → Platinum，其余（新卡、Daily Pass）→ Silver。 */
const TIER_RULE={gold:9,platinum:18};
const kindOf=c=>c.kind||(/daily/i.test(c.name||'')?'daily':/30/.test(c.name||'')?'30':/10\s*\+\s*1/.test(c.name||'')?'10+1':'other');
function tierInfo(m){
  const cs=S.cards.filter(c=>c.phone===m.phone);
  const n10=(+m.prior10||0)+cs.filter(c=>kindOf(c)==='10+1').length, n30=(+m.prior30||0)+cs.filter(c=>kindOf(c)==='30').length;
  const score=n10+3*n30;
  const auto=score>TIER_RULE.platinum?'Platinum':score>TIER_RULE.gold?'Gold':'Silver';
  const tier=m.tierOverride&&TIERS[m.tierOverride]?m.tierOverride:auto;
  const nextAt=auto==='Silver'?TIER_RULE.gold+1:auto==='Gold'?TIER_RULE.platinum+1:null;
  return {tier,auto,manual:!!m.tierOverride,n10,n30,score,next:auto==='Silver'?'Gold':auto==='Gold'?'Platinum':null,need:nextAt?nextAt-score:0};
}
const TIER_STEPS=[{tier:'Gold',n10:TIER_RULE.gold+1,n30:Math.floor(TIER_RULE.gold/3)+1},{tier:'Platinum',n10:TIER_RULE.platinum+1,n30:Math.floor(TIER_RULE.platinum/3)+1}];
function nextSteps(m){ const t=tierInfo(m); if(t.manual) return []; const rank={Silver:0,Gold:1,Platinum:2}; return TIER_STEPS.filter(x=>rank[x.tier]>rank[t.auto]).map(x=>({...x,left10:Math.max(0,x.n10-t.n10),left30:Math.max(0,x.n30-t.n30)})); }
function stepText(x){ return `10+1 卡续到<b>第 ${x.n10} 张</b>${x.left10?`（还差 ${x.left10} 张）`:''}，或 30 天卡续到<b>第 ${x.n30} 张</b>${x.left30?`（还差 ${x.left30} 张）`:''}，就能升级 <b>${x.tier}</b>`; }
function tierProgress(m){ const n=nextSteps(m)[0]; return n?stepText(n):''; }
const RECENT=3*60e3;
function cardInfo(c){
  const ins=S.checkins.filter(x=>x.cardId===c.id).sort((a,b)=>a.ts-b.ts);
  const used=ins.length, left=Math.max(0,(+c.total||0)-used);
  const hasExp=(+c.days||0)>0, st=parseD(c.start), endT=hasExp?st+((+c.days)-1)*DAY:Infinity, t=parseD(today());
  const notStarted=t<st, daysLeft=hasExp?(t>endT?0:Math.round((endT-Math.max(t,st))/DAY)+1):null;
  const todayN=ins.filter(x=>x.date===today()).length;
  const last=ins[ins.length-1]; const recent=!!last&&Date.now()-last.ts<RECENT;
  const status=left===0?'done':t>endT?'expired':'active';
  return {ins,used,left,end:hasExp?dt(endT):null,daysLeft,todayN,recent,status,notStarted};
}

let scanBusy=false;
async function doCheckin(c,force){
  const r=await api('checkin',{cardId:c.id,code:scanCode,force:!!force});
  if(r.recent) return {recent:true,msg:`刚刚已经打卡成功了，不用重复扫码。${c.name} 还剩 ${r.left} 次。`};
  return {ok:true,msg:`打卡成功！每日消费 +${r.points} 分。${c.name} 还剩 ${r.left} 次。`};
}
async function autoScanCheckin(){
  const m=me(); if(view!=='scan'||!scanOk()||!m||scanResult||scanBusy) return;
  const cs=cardsOf(m.phone).filter(c=>{const k=cardInfo(c);return k.status==='active'&&!k.notStarted;});
  if(cs.length!==1) return;
  scanBusy=true; scanResult='正在打卡…'; render();
  try{ const r=await doCheckin(cs[0],false); scanResult=r.msg; await refresh(); }
  catch(e){ scanResult=null; if(e.code==='bad_qr') scanBad=true; else toast(e.message); render(); }
  finally{ scanBusy=false; }
}
function readHash(){ const mt=(location.hash||'').match(/^#checkin-([a-z0-9]+)$/); if(mt){ scanCode=mt[1]; scanResult=null; scanBad=false; view='scan'; } }

let reSheet=null;
let camStream=null, camTimer=null;
function stopCam(){ if(camTimer){ cancelAnimationFrame(camTimer); camTimer=null; } if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
function loadJsQR(){ return window.jsQR?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);}); }
function gotCode(text){
  const mt=String(text||'').match(/#checkin-([a-z0-9]+)/);
  if(!mt){ toast('这不是 '+brand().name+' 的打卡二维码'); return false; }
  stopCam(); closeSheet(); scanCode=mt[1]; scanResult=null; scanBad=false; view='scan'; render(); window.scrollTo(0,0); return true;
}
async function openScanner(){
  openSheet(`<h3>扫码打卡</h3><div class="cam"><video id="camv" playsinline muted autoplay></video><div class="frame"></div></div>
    <p class="sub" id="camMsg" style="margin:12px 0 0;text-align:center">把柜台的二维码放进框里</p>
    <div class="actions" style="margin-top:12px"><button class="btn ghost" data-act="close">取消</button></div>`);
  const msg=t=>{const el=document.getElementById('camMsg'); if(el) el.textContent=t;};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ msg('这部手机不能在这里打开相机。请直接用手机的相机 App 扫柜台的二维码。'); return; }
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); }
  catch(e){ msg('没有相机权限。请允许使用相机，或直接用手机的相机 App 扫柜台的二维码。'); return; }
  const v=document.getElementById('camv'); if(!v){ stopCam(); return; }
  v.srcObject=camStream; try{ await v.play(); }catch(_){}
  let detector=null;
  if('BarcodeDetector' in window){ try{ detector=new BarcodeDetector({formats:['qr_code']}); }catch(_){ detector=null; } }
  if(!detector){ try{ await loadJsQR(); }catch(_){ msg('扫描工具载入失败，请直接用手机的相机 App 扫二维码。'); return; } }
  const cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
  let busy=false;
  const tick=async()=>{
    if(!camStream) return;
    if(!busy&&v.readyState>=2){ busy=true;
      try{
        if(detector){ const r=await detector.detect(v); if(r&&r[0]&&gotCode(r[0].rawValue)) return; }
        else { const w=v.videoWidth, h=v.videoHeight; const k=Math.min(1,640/Math.max(w,h)); cv.width=Math.round(w*k); cv.height=Math.round(h*k);
          cx.drawImage(v,0,0,cv.width,cv.height); const d=cx.getImageData(0,0,cv.width,cv.height); const r=window.jsQR(d.data,cv.width,cv.height,{inversionAttempts:'dontInvert'}); if(r&&gotCode(r.data)) return; }
      }catch(_){}
      busy=false; }
    camTimer=requestAnimationFrame(tick);
  };
  tick();
}

  if(a==='ncp'){ const m=S.members.find(x=>x.id===id); if(m) ncpSheet(m.phone); return; }
  if(a==='staffCheckin'){ const c=S.cards.find(x=>x.id===id); if(!c) return; b.disabled=true; await run(()=>api('admin/checkin',{cardId:c.id}),`已帮会员打卡，+${ckPts(c.phone)} 分`); return; }
  if(a==='resetPin'){ const m=S.members.find(x=>x.id===id); if(!m) return; if(!confirmTwice(a+id,b)){ b.textContent='再按一次确认重设'; return; } closeSheet(); await run(()=>api('admin/resetpin',{phone:m.phone}),'密码已重设，会员下次登入时可以设定新密码'); return; }

  if(a==='delCard'&&confirmTwice(a+id,b)){ await run(()=>del('cards',id),'卡已删除（已赚到的积分会保留）'); return; }
  if(a==='approve'){ const r=S.requests.find(x=>x.id===id); if(!r) return; b.disabled=true;

  if(a==='editTask'){ taskForm(S.tasks.find(x=>x.id===id)); return; }
  if(a==='editMember'){ memberForm(S.members.find(x=>x.id===id)); return; }
  if(a==='addPts'){ const m=S.members.find(x=>x.id===id); if(m) ptsForm(m); return; }
  if(a==='delReward'&&confirmTwice(a+id,b)){ await run(()=>del('rewards',id),'礼物已删除'); closeSheet(); return; }

async function saveQrPoster(){
  const src=document.querySelector('#qrbox canvas'); if(!src) return toast('二维码还没准备好');
  const W=900,H=1200,c=document.createElement('canvas'); c.width=W;c.height=H; const x=c.getContext('2d');
  x.fillStyle='#FBF5F3';x.fillRect(0,0,W,H); x.fillStyle='#7A1E3A';x.fillRect(0,0,W,260);
  x.fillStyle='#FFF7F2';x.textAlign='center';x.font='900 72px "Noto Serif SC",serif';x.fillText('NCP 打卡',W/2,140);
  x.font='500 30px "Noto Sans SC",sans-serif';x.fillText(brand().name+' · '+brand().sub,W/2,200);
  x.fillStyle='#fff';x.fillRect(170,330,560,560); x.drawImage(src,200,360,500,500);
  x.fillStyle='#2A1419';x.font='700 40px "Noto Sans SC",sans-serif';x.fillText('打开相机扫一扫，完成今日打卡',W/2,980);
  x.fillStyle='#7D6A6E';x.font='400 28px "Noto Sans SC",sans-serif';x.fillText(qrMode()==='daily'?'本二维码仅限 '+today()+' 使用':'Scan to check in every visit',W/2,1040);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const u=URL.createObjectURL(blob); const lnk=document.createElement('a'); lnk.href=u; lnk.download=fileTag()+'-NCP打卡二维码'+(qrMode()==='daily'?'-'+today():'')+'.png';
  document.body.appendChild(lnk); lnk.click(); lnk.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); toast('二维码海报已下载');
}

/* ---------- daily stats ---------- */
function rangeOf(){
  if(statRange>0){ const t=parseD(today()); return {from:dt(t-(statRange-1)*DAY), to:today()}; }
  let from=statFrom||dt(parseD(today())-29*DAY), to=statTo||today(); if(from>to) [from,to]=[to,from];
  if((parseD(to)-parseD(from))/DAY>365) from=dt(parseD(to)-365*DAY);
  return {from,to};
}
function dailyStats(from,to){
  if(!from){ const r=rangeOf(); from=r.from; to=r.to; }
  const out=[]; for(let t=parseD(from);t<=parseD(to);t+=DAY){ const date=dt(t); const ins=S.checkins.filter(x=>x.date===date);
    const staff=ins.filter(x=>x.by==='staff').length;
    out.push({date,n:ins.length,self:ins.length-staff,staff,u:new Set(ins.map(x=>x.phone)).size,pts:ins.reduce((a,x)=>a+(+x.points||0),0)}); }
  return out;
}
const howOf=b=>b==='staff'?'帮':'自';
const howTag=b=>`<span class="how ${b==='staff'?'h-staff':'h-self'}" title="${b==='staff'?'教练帮打':'顾客自己扫码'}">${howOf(b)}</span>`;
const HOW_LEGEND='自 = 顾客自己扫码　帮 = 教练帮打';
function checkinRows(){
  const {from,to}=rangeOf();
  return S.checkins.filter(x=>x.date>=from&&x.date<=to).sort((a,b)=>a.ts-b.ts).map(x=>{
    const m=S.members.find(y=>y.phone===x.phone), c=S.cards.find(y=>y.id===x.cardId), d=new Date(x.ts);
    return {date:x.date,time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),name:m?m.name:'',phone:x.phone,card:c?('第 '+cardNo(c)+' 张 · '+c.name):'',how:howOf(x.by),pts:+x.points||0};
  });
}
function exportDailyPdf(){
  const days=dailyStats().slice().reverse(); const sum=days.reduce((a,d)=>a+d.n,0);
  const pa=document.getElementById('printArea');
  pa.innerHTML=`<h1>${nt(brand().name)} · 每日打卡统计</h1><div class="meta">${days[days.length-1].date} 至 ${days[0].date}（${days.length} 天）　·　共 ${sum} 人次　·　${new Set(S.checkins.filter(x=>x.date>=days[days.length-1].date&&x.date<=days[0].date).map(x=>x.phone)).size} 位不同会员　·　导出日期 ${today()}</div>
  <div class="meta">${HOW_LEGEND}</div><h2>每日汇总</h2><table><thead><tr><th>日期</th><th>星期</th><th>打卡人次</th><th>自</th><th>帮</th><th>打卡人数</th><th>自动加分</th></tr></thead><tbody>
  ${days.map(d=>`<tr><td>${d.date}</td><td>${'日一二三四五六'[new Date(parseD(d.date)).getDay()]}</td><td>${d.n}</td><td>${d.self}</td><td>${d.staff}</td><td>${d.u}</td><td>${d.pts}</td></tr>`).join('')}</tbody></table>
  <h2>打卡明细</h2><table><thead><tr><th>日期</th><th>时间</th><th>会员</th><th>电话</th><th>卡</th><th>自/帮</th><th>加分</th></tr></thead><tbody>
  ${checkinRows().map(r=>`<tr><td>${r.date}</td><td>${r.time}</td><td>${nt(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.card)}</td><td>${r.how==='帮'?'<b>帮</b>':r.how}</td><td>${r.pts}</td></tr>`).join('')||'<tr><td colspan="7">这段期间没有打卡记录</td></tr>'}</tbody></table>`;
  pa.hidden=false; const done=()=>{ pa.hidden=true; pa.innerHTML=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done); setTimeout(()=>window.print(),100); toast('在打印画面选择「另存为 PDF / Save as PDF」');
}
function exportDailyCsv(){
  const qn=v=>'"'+String(v??'').replace(/"/g,'""')+'"', q=v=>qn(trText(String(v??'')));
  const rows=[['日期','星期','打卡人次','自','帮','打卡人数','自动加分'].map(q).join(',')].concat(dailyStats().slice().reverse().map(d=>[d.date,'星期'+'日一二三四五六'[new Date(parseD(d.date)).getDay()],d.n,d.self,d.staff,d.u,d.pts].map(q).join(',')));
  rows.push('',q(HOW_LEGEND),['日期','时间','会员','电话','卡','自/帮','加分'].map(q).join(','));
  checkinRows().forEach(r=>rows.push([q(r.date),q(r.time),qn(r.name),qn("'"+r.phone),q(r.card),q(r.how),q(r.pts)].join(',')));
  const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fileTag()+'-每日打卡-'+rangeOf().from+'至'+rangeOf().to+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  toast('Excel 已下载');
}

/* ---------- export ---------- */
function reportRows(){
  return S.members.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh')).map(m=>({m,st:memberStats(m)}));
}
function exportPdf(){
  const rows=reportRows(), d=dt(Date.now());
  const st=k=>({active:'进行中',done:'已用完',expired:'已过期'})[k]||'';
  const html=`<h1>${nt(brand().name)} · 会员报表</h1><div class="meta">导出日期：${d}　·　会员 ${rows.length} 人　·　NCP 卡 ${S.cards.length} 张（未付款 ${S.cards.filter(c=>!c.paid).length} 张）　·　累计打卡 ${S.checkins.length} 次</div>
  <h2>会员总表</h2><table><thead><tr><th>#</th><th>名字</th><th>电话</th><th>等级</th><th>积分</th><th>买过几张卡</th><th>未付款</th><th>目前的卡</th><th>剩余次数</th><th>累计打卡</th><th>最近打卡</th><th>加入日期</th></tr></thead><tbody>
  ${rows.map(({m,st:x},i)=>`<tr><td>${i+1}</td><td>${nt(m.name)}</td><td>${esc(m.phone)}</td><td>${esc(m.tier)}</td><td>${fmt(x.pts)}</td><td>${x.nCards}</td><td>${unpaidOf(m.phone)||'—'}</td><td>${x.cur?'第 '+cardNo(x.cur)+' 张 · '+esc(x.cur.name)+'（'+st(x.curInfo.status)+'）':'—'}</td><td>${x.curInfo?x.curInfo.left:'—'}</td><td>${x.nCheckins}</td><td>${x.last||'—'}</td><td>${esc(m.joined||'')}</td></tr>`).join('')}</tbody></table>
  <h2>每位会员的卡记录</h2>
  ${rows.filter(r=>r.st.nCards).map(({m,st:x})=>`<div class="mb"><b>${nt(m.name)}（${esc(m.phone)}）</b><table><thead><tr><th>第几张</th><th>配套</th><th>开卡日期</th><th>总次数</th><th>已打卡</th><th>剩余</th><th>状态</th><th>付款</th><th>付款日期</th><th>金额</th><th>最后一次打卡</th></tr></thead><tbody>
    ${x.cards.map((c,i)=>{const k=cardInfo(c);const last=k.ins[k.ins.length-1];return `<tr><td>第 ${i+1} 张</td><td>${esc(c.name)}</td><td>${esc(c.start)}</td><td>${+c.total||0}</td><td>${k.used}</td><td>${k.left}</td><td>${st(k.status)}</td><td>${c.paid?'已付款':'<b>未付款</b>'}</td><td>${c.paid?esc(c.paidAt||''):'—'}</td><td>${c.paidAmount?'RM'+esc(c.paidAmount):'—'}</td><td>${last?last.date:'—'}</td></tr>`}).join('')}</tbody></table></div>`).join('')||'<p>还没有任何 NCP 卡记录。</p>'}`;
  const pa=document.getElementById('printArea'); pa.innerHTML=html; pa.hidden=false;
  const done=()=>{ pa.hidden=true; pa.innerHTML=''; window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(()=>{ if(!pa.hidden&&!matchMedia('print').matches) done(); },1500); },100);
  toast('在打印画面选择「另存为 PDF / Save as PDF」');
}
function exportCsv(){
  const qn=v=>'"'+String(v??'').replace(/"/g,'""')+'"', q=v=>qn(trText(String(v??'')));
  const head=['名字','电话','等级','积分','买过几张卡','未付款卡','目前第几张','目前配套','剩余次数','累计打卡','最近打卡','加入日期'];
  const lines=[head.map(q).join(',')].concat(reportRows().map(({m,st:x})=>[qn(m.name),qn("'"+m.phone)].concat([m.tier,x.pts,x.nCards,unpaidOf(m.phone),x.cur?cardNo(x.cur):'',x.cur?x.cur.name:'',x.curInfo?x.curInfo.left:'',x.nCheckins,x.last,m.joined||''].map(q)).join(',')));
  const card=['电话','名字','第几张','配套','开卡日期','总次数','已打卡','剩余','状态','付款','付款日期','金额 RM','付款方式','备注'];
  const cl=[card.map(q).join(',')];
  reportRows().forEach(({m,st:x})=>x.cards.forEach((c,i)=>{const k=cardInfo(c); cl.push([qn("'"+m.phone),qn(m.name)].concat([i+1,c.name,c.start,+c.total||0,k.used,k.left,({active:'进行中',done:'已用完',expired:'已过期'})[k.status],c.paid?'已付款':'未付款',c.paid?c.paidAt:'',c.paidAmount||'',c.payMethod||'',c.paidNote||''].map(q)).join(','));}));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')+'\r\n\r\n'+cl.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fileTag()+'-会员报表-'+dt(Date.now())+'.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  toast('Excel 报表已下载');
}

/* ---------- boot ---------- */
document.documentElement.lang=LANG; trWatch();
readHash(); window.addEventListener('hashchange',()=>{readHash(); render(); if(location.hash==='#admin'){ if(isAdmin){ view='admin'; render(); } else document.querySelector('[data-act="adminLogin"]')?.click(); }});
async function boot(){
  try{ await refresh();
    if(location.hash==='#admin'){ if(isAdmin){ view='admin'; render(); } else document.querySelector('[data-act="adminLogin"]')?.click(); }
    if(location.hash==='#notices'){ try{history.replaceState(null,'',location.pathname+location.search)}catch(_){} openNotices(); } }
  catch(e){ document.getElementById('app').innerHTML=`<div class="load"><div style="font-family:var(--f-display);font-size:26px;color:var(--wine)">${nt(brand().name)}</div><div>${esc(e.message)}</div><button class="btn" onclick="boot()">再试一次</button></div>`; }
}
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{ if(e.data&&e.data.type==='open-notices') refresh().then(openNotices).catch(()=>{}); });
boot();
setInterval(()=>{ if(document.visibilityState==='visible'&&!document.getElementById('layer').innerHTML&&!document.activeElement?.matches('input,textarea,select')) refresh().catch(()=>{}); },30000);
</script>
